kind = "web"
previewPath = "/"
title = "SW Grill Restaurant Website"
description = "A polished restaurant website for SW Grill in Boca Raton, with a strong sense of place, menu discovery, reservations, and contact details for diners and club guests."
version = "1.0.0"
id = "artifacts/sw-grill-website"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23517

[services.development]
run = "pnpm --filter @workspace/sw-grill-website run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sw-grill-website", "run", "build" ]
serve = "static"
publicDir = "artifacts/sw-grill-website/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23517"
BASE_PATH = "/"
